[package]
name = "stt-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "stt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
signal-hook = "0.3"
screencapturekit = "1.5"
ratatui = "0.29"
crossterm = "0.28"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
eyre = "0.6"

# STT and speaker embedding
sherpa-rs = { version = "0.6", features = ["download-binaries"] }

[profile.release]
opt-level = 3
lto = true
