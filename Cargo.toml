[package]
name = "stt-cli"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "stt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
signal-hook = "0.3"
screencapturekit = "1.5"
ratatui = "0.29"
crossterm = "0.28"
dirs = "5"
libc = "0.2"

# Post-session Whisper Turbo retranscription (whisper.cpp with Metal GPU)
whisper-rs = { version = "0.15", features = ["metal"] }

# Speaker diarization (pyannote + 3dspeaker) and audio file reading
sherpa-rs = { version = "0.6", features = ["download-binaries"] }

# Kyutai STT streaming (real-time transcription)
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
moshi = "0.6"
hf-hub = "0.4"
sentencepiece = "0.11"

[features]
default = ["metal"]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[profile.release]
opt-level = 3
lto = true
