[package]
name = "stt-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.15"
hf-hub = "0.4"
kaudio = "0.2"
moshi = "0.6"
rubato = "0.15"
sentencepiece = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
signal-hook = "0.3"
screencapturekit = "1.5"
ratatui = "0.29"
crossterm = "0.28"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[features]
default = ["metal"]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[profile.release]
opt-level = 3
lto = true
